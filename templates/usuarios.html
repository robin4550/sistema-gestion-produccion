{% extends "base.html" %}{% block titulo %}Usuarios{% endblock %}
{% block contenido %}<h1>Usuarios</h1>
<form class="fila" method="post"><label>Nombre<input name="nombre" required></label><label>Usuario<input name="usuario" required></label>
<label>Contraseña<input name="clave" type="password" minlength="6" required></label>
<label>Rol<select name="rol">{% for r in roles %}<option>{{ r }}</option>{% endfor %}</select></label><button class="primario">Crear usuario</button></form>
<div class="tabla"><table><tr><th>Nombre</th><th>Usuario</th><th>Rol</th></tr>
{% for u in datos %}<tr><td>{{ u.nombre }}</td><td>{{ u.usuario }}</td><td>{{ u.rol }}</td></tr>{% endfor %}</table></div>{% endblock %}
